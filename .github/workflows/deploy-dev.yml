name: Deploy Dashboard Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: dashboard-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to dev server
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate required secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_DASHBOARD_PATH: ${{ secrets.SERVER_DASHBOARD_PATH }}
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_DASHBOARD_PATH"

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/dashboard_deploy_key
          chmod 600 ~/.ssh/dashboard_deploy_key
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy dev branch
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SERVER_DASHBOARD_PATH: ${{ secrets.SERVER_DASHBOARD_PATH }}
        run: |
          ssh -i ~/.ssh/dashboard_deploy_key -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "bash -se -- '$SERVER_DASHBOARD_PATH'" <<'REMOTE'
          DASHBOARD_PATH="$1"

          cd "$DASHBOARD_PATH"
          DEPLOY_BRANCH=dev bash deploy.sh
          REMOTE
